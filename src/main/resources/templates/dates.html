<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Calypso')}"></head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>
    <h1>Dates</h1>

    <div>
        <a th:href="@{/dates(year=${previousYear}, month=${previousMonth}, reservationId=${reservationId})}">
            ← Previous
        </a>

        <strong th:text="${month + ' ' + year}"></strong>

        <a th:href="@{/dates(year=${nextYear}, month=${nextMonth}, reservationId=${reservationId})}">
            Next →
        </a>
    </div>

    <table>
        <thead>
        <tr>
            <th>Mon</th>
            <th>Tue</th>
            <th>Wed</th>
            <th>Thu</th>
            <th>Fri</th>
            <th>Sat</th>
            <th>Sun</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="week : ${weeks}">
            <td th:each="day : ${week}">
                <button
                        th:if="${day != null and dates.contains(day)}"
                        type="button"
                        th:text="${day.dayOfMonth}"
                        th:attr="hx-get=@{/boats/fragment(date=${day}, reservationId=${reservationId})}"
                        hx-target="#boats-container"
                        hx-swap="innerHTML">
                </button>

                <span
                        th:if="${day != null and !dates.contains(day)}"
                        th:text="${day.dayOfMonth}">
                </span>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${reservationId != null}" th:text="${reservationId}"></p>
    <div id="boats-container"></div>
    <div id="slots-container"></div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
