<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Calypso')}"></head>

<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
  <h1>Edit information</h1>

  <form th:action="@{/edit/options/contact}" method="post" th:object="${reservationEditRequest}">

    <input type="hidden" name="reservationId" th:value="${reservationId}">
    Email Address: <input type="email" th:field="*{email}" required disabled><br>
    First Name: <input type="text" th:field="*{firstName}" required><br>
    Last Name: <input type="text" th:field="*{lastName}" required><br>
    Phone Number: <input type="text" th:field="*{phoneNumber}" required><br>
    Pax: <input type="number" th:field="*{pax}" required><br>

    <button type="submit">Edit information</button>
  </form>

</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
